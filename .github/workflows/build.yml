name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Arduino core, libraries and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
            ~/.cache/arduino
          key: arduino-esp32-3.3.7-aj7.4.3-v1

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.7
          arduino-cli lib install "ArduinoJson@7.4.3"

      - name: Compile
        run: |
          # arduino-cli needs the folder name to match the .ino name
          mkdir -p "$RUNNER_TEMP/SecurityCam"
          cp -r *.ino *.cpp *.h "$RUNNER_TEMP/SecurityCam/"
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3:PSRAM=opi \
            --build-path "$RUNNER_TEMP/build" \
            --warnings default \
            "$RUNNER_TEMP/SecurityCam"
          mkdir -p dist
          cp "$RUNNER_TEMP/build/SecurityCam.ino.bin" dist/xiao-sherlock-ota.bin
          cp "$RUNNER_TEMP/build/SecurityCam.ino.merged.bin" dist/xiao-sherlock-full.bin 2>/dev/null || true
          ls -l dist

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiao-sherlock-firmware-${{ github.sha }}
          path: dist/
          retention-days: 30
